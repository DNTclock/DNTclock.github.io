<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Обычные, десятичные часы и таймер</title>
<style>
/* Начинает описание правил оформления для всего тела (фона и текста) страницы */
body {
    /* Окрашивает задний фон страницы в глубокий темно-серый цвет */
    background: #111;
    /* Делает цвет основного текста почти белым для контраста */
    color: #eee;
    /* Устанавливает моноширинный шрифт, где все цифры и буквы одинаковой ширины */
    font-family: Consolas, monospace;
    /* Выравнивает все текстовые блоки и элементы строго по центру экрана */
    text-align: center;
    /* Делает отступ в 50 пикселей сверху, чтобы часы не прилипали к краю экрана */
    margin-top: 50px;
/* Закрывает блок стилей для элемента body */
}
/* Начинает описание общих стилей для классов .clock (часы) и .timer (таймер) */
.clock, .timer {
    /* Увеличивает размер цифр часов и таймера до крупных 48 пикселей */
    font-size: 48px;
    /* Создает свободную зону в 20 пикселей вокруг каждого блока, чтобы они разделялись */
    margin: 20px;
/* Закрывает общий блок стилей для классов .clock и .timer */
}
/* Начинает описание стилей для класса .label (текстовые подписи над часами) */
.label {
    /* Делает размер шрифта подписей аккуратным и небольшим — 18 пикселей */
    font-size: 18px;
    /* Красит текст подписей в неяркий серый цвет, чтобы они не отвлекали от главных цифр */
    color: #aaa;
    /* Добавляет 25 пикселей отступа сверху, визуально отделяя подпись от верхних элементов */
    margin-top: 25px;
/* Закрывает блок стилей для класса .label */
}
/* Стили для контейнера интерактивного тестера в нижнем правом углу */
.tester-container {
    /* Фиксирует элемент на экране, чтобы он не двигался при прокрутке страницы */
    position: fixed;
    /* Прижимает блок к правому краю экрана с отступом в 20 пикселей */
    right: 20px;
    /* Прижимает блок к нижнему краю экрана с отступом в 20 пикселей */
    bottom: 20px;
    /* Выравнивает содержимое тестера по левому краю для аккуратности */
    text-align: left;
    /* Задает полупрозрачный темный фон для всего мини-окошка */
    background: rgba(30, 30, 30, 0.8);
    /* Добавляет внутренние отступы в 15 пикселей со всех сторон */
    padding: 15px;
    /* Скругляет углы окошка тестера на 8 пикселей */
    border-radius: 8px;
    /* Добавляет тонкую серую рамку вокруг окошка */
    border: 1px solid #444;
/* Закрывает стили для .tester-container */
}
/* Стили для финального единственного квадрата-пробника в тестере */
.live-box {
    /* Делает элемент блочно-строчным, чтобы он стоял в ряд с полем ввода */
    display: inline-block;
    /* Задает ширину квадрата в 30 пикселей */
    width: 30px;
    /* Задает высоту квадрата в 30 пикселей */
    height: 30px;
    /* Стартовый фоновый цвет квадрата (серый) */
    background-color: #888;
    /* Скругляет углы квадрата на 4 пикселя */
    border-radius: 4px;
    /* Выравнивает квадрат строго по центру строки относительно поля ввода */
    vertical-align: middle;
    /* Делает отступ справа, отделяя квадрат от инпута */
    margin-right: 10px;
    /* Добавляет легкую рамку, чтобы квадрат не сливался с фоном при выборе темных цветов */
    border: 1px solid #666;
/* Закрывает стили для .live-box */
}
/* Стили для текстового поля ввода кодов цветов */
.color-input {
    /* Задает ширину поля ввода в 120 пикселей */
    width: 120px;
    /* Делает внутренние отступы в 5 пикселей для удобства ввода текста */
    padding: 5px;
    /* Окрашивает фон инпута в темно-серый цвет */
    background: #222;
    /* Делает текст внутри инпута белым */
    color: #fff;
    /* Убирает стандартную жирную рамку браузера */
    border: 1px solid #555;
    /* Скругляет углы поля ввода на 4 пикселя */
    border-radius: 4px;
    /* Устанавливает такой же моноширинный шрифт, как у всей страницы */
    font-family: inherit;
    /* Выравнивает поле ввода по центру строки рядом с квадратом */
    vertical-align: middle;
/* Закрывает стили для .color-input */
}
</style>
</head>
<body>

<div class="label">Обычное время (24 часа)</div>
<div id="normalClock" class="clock">--:--:--</div>

<div class="label">Десятичное время (10ч × 100 × 100)</div>
<div id="decimalClock" class="clock">--:--:--</div>

<div id="timerLabel" class="label">Загрузка таймера...</div>
<div id="countdownTimer" class="timer">--:--:--</div>

<div class="tester-container">
    <div style="font-size: 12px; color: #888; margin-bottom: 5px;">Проба цвета на ходу:</div>
    <span id="liveBox" class="live-box"></span>
    <input type="text" id="colorInput" class="color-input" placeholder="#00ffff" oninput="document.getElementById('liveBox').style.backgroundColor = this.value">
</div>

<script>
// Создает переменную для точного времени. Пока интернет-ответ не пришел, внутри лежит пустота (null)
let baseTime = null;
// Создает переменную для фиксации момента запроса к серверу времени
let lastFetch = null;

// Объявляет асинхронную функцию, которая умеет делать паузы и ждать ответы из сети
async function fetchUTCTime() {
    // Открывает защищенный блок: если упадет интернет, программа уйдет в блок catch
    try {
        // Делает сетевой запрос к API, определяющему время по IP-адресу
        const res = await fetch('https://worldtimeapi.org/api/ip');
        // Переводит полученный сырой ответ сервера в удобный формат JSON-объекта
        const data = await res.json();
        // Вытаскивает строку точного времени, превращает в объект даты и сохраняет в baseTime
        baseTime = new Date(data.datetime);
        // Записывает текущее системное время компьютера прямо в момент успешного получения данных
        lastFetch = Date.now();
    // Если в блоке try произошел сбой (нет сети), управление мгновенно передается сюда
    } catch (err) {
        // Выводит техническое сообщение о сбое в скрытую консоль браузера
        console.error("Ошибка при получении времени, используем системное:", err);
        // В качестве спасательного круга берет текущее системное время самого компьютера
        baseTime = new Date();
        // Точно так же фиксирует миллисекунды компьютера на момент аварийного переключения
        lastFetch = Date.now();
    // Закрывает защитный блок обработки ошибок catch
    }
// Закрывает асинхронную функцию fetchUTCTime
}

// Объявляет функцию, которая отвечает за перерасчет и перерисовку всех цифр и стилей
function updateClocks() {
    // Проверяет: если baseTime еще пустой (сервер долго отвечает при старте), прервать функцию
    if (!baseTime) return;

    // Считает «хвостик»: сколько миллисекунд «натикало» на часах компьютера с момента последней синхронизации
    const delta = Date.now() - lastFetch;
    // Создает объект идеального текущего времени, прибавляя этот хвостик к точному базовому времени
    const now = new Date(baseTime.getTime() + delta);

    // ===== Обычное время =====
    // Берет текущий час, делает строкой и, если цифра одна, дописывает 0 спереди (например, 05)
    const h = String(now.getHours()).padStart(2, '0');
    // Получает текущие минуты и точно так же гарантирует двухзначный формат
    const m = String(now.getMinutes()).padStart(2, '0');
    // Получает секунды текущего времени и приводит их к красивому виду с ведущим нулем
    const s = String(now.getSeconds()).padStart(2, '0');
    // Находит элемент с id "normalClock" и обновляет его текстовое содержимое
    document.getElementById("normalClock").textContent = `${h}:${m}:${s}`;

    // ===== Десятичное время =====
    // Начинает сбор секунд, прошедших с полночи. Сначала переводит часы текущего дня в секунды
    const secondsSinceMidnight =
        now.getHours() * 3600 +
        // Переводит минуты текущего дня в секунды, умножая их на 60
        now.getMinutes() * 60 +
        // Прибавляет «чистые» секунды текущей минуты
        now.getSeconds() +
        // Делит текущие миллисекунды на 1000, превращая их в дробную часть секунды для плавности
        now.getMilliseconds() / 1000;

    // Вычисляет долю прошедших суток: делит секунды с полночи на 86400 (всего секунд в сутках)
    const decimalDayFraction = secondsSinceMidnight / 86400;
    // Конвертирует полученную долю в десятичные секунды (в десятичных сутках их ровно 100 000)
    const totalDecimalSeconds = decimalDayFraction * 100000;

    // Находит количество десятичных часов (1 дес. час = 10 000 дес. секунд). Округляет вниз
    const decHour = Math.floor(totalDecimalSeconds / 10000);
    // Находит десятичные минуты: берет остаток от деления на часы и делит его на 100
    const decMinute = Math.floor((totalDecimalSeconds % 10000) / 100);
    // Берет финальный остаток от деления на 100, который становится десятичными секундами
    const decSecond = Math.floor(totalDecimalSeconds % 100);

    // Превращает десятичный час в двухзначную строку, при необходимости подставляя ноль в начало
    const dh = String(decHour).padStart(2, '0');
    // Превращает десятичные минуты в двухзначный формат
    const dm = String(decMinute).padStart(2, '0');
    // Приводит десятичные секунды к итоговому двухзначному виду перед выводом на экран
    const ds = String(decSecond).padStart(2, '0');

    // Находит элемент id "decimalClock" и обновляет его текстовые цифры
    document.getElementById("decimalClock").textContent = `${dh}:${dm}:${ds}`;

    // ===== Умный таймер рабочего графика =====
    // Получает текущий день недели: 0 — воскресенье, 1 — понедельник, 5 — пятница, 6 — суббота
    const currentDay = now.getDay();
    
    // Создает объект даты, указывающий ровно на 08:00 утра СЕГОДНЯ
    const startOfWorkToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 8, 0, 0, 0);
    
    // По умолчанию создает время окончания работы на СЕГОДНЯ на 17:15
    let endOfWorkToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 17, 15, 0, 0);
    // Проверяет условие: если сегодня пятница (день недели равен 5)
    if (currentDay === 5) {
        // Перезаписывает часы окончания работы на 16:00 специально для короткой пятницы
        endOfWorkToday.setHours(16, 0, 0, 0);
    }

    // Создает пустую текстовую переменную, куда позже запишется нужная фраза подписи для таймера
    let labelText = "";
    // Создает пустую переменную для хранения конечной даты, к которой таймер будет вести отсчет
    let targetTime = null;

    // Логическое условие: возвращает true, если сегодня будний день (от понедельника-1 до пятницы-5)
    const isWorkingDay = (currentDay >= 1 && currentDay <= 5);

    // Ссылка на DOM-элемент самого таймера, чтобы ниже динамически управлять его цветом через .style
    const timerElement = document.getElementById("countdownTimer");

    // Сложная проверка: если сегодня будни И текущее время уже больше 8:00 И меньше конца работы
    if (isWorkingDay && now >= startOfWorkToday && now < endOfWorkToday) {
        // Значит, пользователь сейчас на работе. Пишем фразу "До конца рабочего дня:"
        labelText = "До конца рабочего дня:";
        // Назначаем целью для обратного отсчета время завершения сегодняшней смены
        targetTime = endOfWorkToday;

        // --- МЕХАНИКА ПЛАВНОГО ПЕРЕЛИВА ЦВЕТА ---
        // Считаем общую продолжительность рабочего дня в миллисекундах
        const totalWorkMs = endOfWorkToday - startOfWorkToday;
        // Считаем, сколько миллисекунд работы уже прошло с 08:00 утра
        const passedWorkMs = now - startOfWorkToday;
        // Получаем долю прогресса дня (число от 0.0 в начале дня до 1.0 в самом конце)
        const progress = passedWorkMs / totalWorkMs;

        // Вычисляем текущую красную составляющую цвета (от 255 на старте падает до 0 в конце)
        const r = Math.floor(255 - (255 * progress));
        // Вычисляем зеленую составляющую цвета (от 85 на старте плавно растет до 255 в конце)
        const g = Math.floor(85 + ((255 - 85) * progress));
        // Вычисляем синюю составляющую цвета (от 85 на старте плавно растет до 127 в конце)
        const b = Math.floor(85 + ((127 - 85) * progress));

        // НА КУРСЕ ИСПОЛНЕНИЯ: Меняем стиль цвета текста таймера напрямую через JavaScript!
        timerElement.style.color = `rgb(${r}, ${g}, ${b})`;
    // Если хотя бы одно условие не совпало (уже вечер, ночь, раннее утро или наступили выходные)
    } else {
        // Корректируем подпись таймера, так как сейчас идет личное время пользователя
        labelText = "До начала рабочего дня:";
        // Вне рабочего времени возвращаем таймеру фиксированный стандартный красный цвет
        timerElement.style.color = "#ff5555";
        
        // По умолчанию нацеливаемся на ЗАВТРАШНЕЕ утро на 08:00
        let nextTarget = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 8, 0, 0, 0);
        
        // Логический нюанс: если сегодня рабочий день, но часы показывают раннее утро (например, 07:30)
        if (isWorkingDay && now < startOfWorkToday) {
            // То целью ставим СЕГОДНЯШНЕЕ утро 08:00, а не завтрашнее
            nextTarget = startOfWorkToday;
        // Если рабочий день уже точно позади или сегодня законный выходной (суббота/воскресенье)
        } else {
            // Включаем цикл: пока проверяемый день недели является воскресеньем (0) или субботой (6)
            while (nextTarget.getDay() === 0 || nextTarget.getDay() === 6) {
                // Прибавляем к проверяемой дате по одному дню, "перешагивая" через выходные дни
                nextTarget.setDate(nextTarget.getDate() + 1);
            }
        }
        // Записываем финально рассчитанное утро рабочего дня в качестве главной мишени для таймера
        targetTime = nextTarget;
    }

    // Вычитает из целевого времени текущее время, получая чистую разницу в миллисекундах
    const diffMs = targetTime - now;

    // Переводит миллисекунды в полные часы. Округляет вниз
    const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
    // Находит остаток от часов и переводит его в полные минуты
    const diffMinutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
    // Берет остаток от минут и переводит его в итоговые секунды
    const diffSeconds = Math.floor((diffMs % (1000 * 60)) / 1000);

    // Превращает оставшиеся часы в строку и добавляет ноль спереди, если часов осталось меньше 10
    const th = String(diffHours).padStart(2, '0');
    // Приводит оставшиеся минуты к красивому двухзначному формату
    const tm = String(diffMinutes).padStart(2, '0');
    // Приводит оставшиеся секунды к красивому двухзначному формату
    const ts = String(diffSeconds).padStart(2, '0');

    // Находит элемент id "timerLabel" и обновляет подпись ("До конца..." или "До начала...")
    document.getElementById("timerLabel").textContent = labelText;
    // Обновляет текстовые цифры в самом таймере
    timerElement.textContent = `${th}:${tm}:${ts}`;
// Полностью закрывает главную функцию updateClocks
}

// Вызывает асинхронную функцию запроса времени. Меток .then указывает, что делать строго ПОСЛЕ ответа сервера
fetchUTCTime().then(() => {
    // Вызывает функцию обновления часов один раз вручную, чтобы сразу показать цифры пользователю
    updateClocks();
    // Настраивает бесконечный интервал: функция updateClocks будет автоматически запускаться каждые 50 миллисекунд
    setInterval(updateClocks, 50);
    // Настраивает второй интервал: фоновый запрос точного времени к API будет происходить каждые 5 минут
    setInterval(fetchUTCTime, 5 * 60 * 1000);
});
</script>
</body>
</html>
