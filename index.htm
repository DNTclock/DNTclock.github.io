<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Космический пульт времени</title>
<style>
/* Начинает описание правил оформления для всего тела (фона и текста) страницы */
body {
    /* Окрашивает задний фон страницы в глубокий темно-серый цвет */
    background: #111;
    /* Делает цвет основного текста почти белым для контраста */
    color: #eee;
    /* Устанавливает моноширинный шрифт, где все цифры и буквы одинаковой ширины */
    font-family: Consolas, monospace;
    /* Выравнивает все текстовые блоки и элементы строго по центру экрана */
    text-align: center;
    /* Делает отступ в 100 пикселей сверху, чтобы освободить место под таймер */
    margin-top: 100px;
/* Закрывает блок стилей для элемента body */
}
/* Начинает описание стилей для центрального блока обычных часов */
.clock {
    /* Увеличивает размер цифр обычных часов до внушительных 64 пикселей */
    font-size: 64px;
    /* Создает свободную зону в 20 пикселей вокруг блока */
    margin: 20px;
/* Закрывает блок стилей для .clock */
}
/* Начинает описание стилей для класса .label (текстовые подписи) */
.label {
    /* Делает размер шрифта подписей аккуратным и небольшим — 18 пикселей */
    font-size: 18px;
    /* Красит текст подписей в неяркий серый цвет */
    color: #aaa;
    /* Добавляет отступ сверху */
    margin-top: 25px;
/* Закрывает блок стилей для класса .label */
}
/* Стили для контейнера таймера в ПРАВОМ ВЕРХНЕМ УГЛУ */
.timer-corner {
    /* Фиксирует таймер на экране, чтобы он не двигался */
    position: fixed;
    /* Прижимает блок к правому краю с отступом в 30 пикселей */
    right: 30px;
    /* Прижимает блок к верхнему краю с отступом в 20 пикселей */
    top: 20px;
    /* Выравнивает текст внутри этого контейнера по правому краю */
    text-align: right;
    /* Задает полупрозрачный темный фон, чтобы текст не сливался */
    background: rgba(20, 20, 20, 0.8);
    /* Добавляет внутренний отступ в 10 пикселей */
    padding: 10px;
    /* Скругляет углы рамки таймера */
    border-radius: 6px;
/* Закрывает стили для .timer-corner */
}
/* Стили для цифр таймера в углу */
.timer-digits {
    /* Делает цифры таймера крупными — 36 пикселей */
    font-size: 36px;
    /* Делает шрифт жирным */
    font-weight: bold;
/* Закрывает стили для .timer-digits */
}
/* Стили для бегущей строки в самом низу страницы */
.space-marquee {
    /* Фиксирует бегущую строку в самом низу экрана */
    position: fixed;
    /* Прижимает к левому краю */
    left: 0;
    /* Прижимает к нижнему краю */
    bottom: 0;
    /* Растягивает строку на всю ширину экрана */
    width: 100%;
    /* Красит фон бегущей строки в черный цвет */
    background: #000;
    /* Задает высоту строки в 40 пикселей */
    height: 40px;
    /* Выравнивает текст по вертикали, чтобы он шел ровно по центру полосы */
    line-height: 40px;
    /* Делает текст золотисто-салатовым, в космическом стиле */
    color: #00ffaa;
    /* Устанавливает размер шрифта поменьше — 14 пикселей */
    font-size: 14px;
    /* Добавляет тонкую серую полоску над бегущей строкой */
    border-top: 1px solid #333;
/* Закрывает стили для .space-marquee */
}
/* Стили для контейнера интерактивного тестера в нижнем правом углу (над бегущей строкой) */
.tester-container {
    /* Фиксирует элемент на экране */
    position: fixed;
    /* Отступ справа */
    right: 20px;
    /* Поднимаем чуть выше, чтобы не перекрывать бегущую строку */
    bottom: 50px;
    /* Выравнивает содержимое по левому краю */
    text-align: left;
    /* Задает полупрозрачный фон */
    background: rgba(30, 30, 30, 0.8);
    /* Внутренние отступы */
    padding: 15px;
    /* Скругляет углы */
    border-radius: 8px;
    /* Добавляет рамку */
    border: 1px solid #444;
/* Закрывает стили для .tester-container */
}
/* Стили для финального единственного квадрата-пробника в тестере */
.live-box {
    /* Делает элемент блочно-строчным */
    display: inline-block;
    /* Ширина 30 пикселей */
    width: 30px;
    /* Высота 30 пикселей */
    height: 30px;
    /* Стартовый фоновый цвет */
    background-color: #888;
    /* Скругляет углы */
    border-radius: 4px;
    /* Выравнивает по центру строки */
    vertical-align: middle;
    /* Отступ справа */
    margin-right: 10px;
/* Закрывает стили для .live-box */
}
/* Стили для текстового поля ввода кодов цветов */
.color-input {
    /* Ширина 120 пикселей */
    width: 120px;
    /* Внутренние отступы */
    padding: 5px;
    /* Фон инпута */
    background: #222;
    /* Цвет текста */
    color: #fff;
    /* Рамка */
    border: 1px solid #555;
    /* Скругляет углы */
    border-radius: 4px;
    /* Наследует шрифт страницы */
    font-family: inherit;
    /* Выравнивает по центру строки */
    vertical-align: middle;
/* Закрывает стили для .color-input */
}
</style>
</head>
<body>

<div id="timezoneLabel" class="label">Определяем часовой пояс...</div>
<div id="normalClock" class="clock">--:--:--</div>

<div class="timer-corner">
    <div id="timerLabel" style="font-size: 12px; color: #aaa; margin-bottom: 2px;">Загрузка...</div>
    <div id="countdownTimer" class="timer-digits">--:--:--</div>
</div>

<div class="tester-container">
    <div style="font-size: 12px; color: #888; margin-bottom: 5px;">Проба цвета на ходу:</div>
    <span id="liveBox" class="live-box"></span>
    <input type="text" id="colorInput" class="color-input" placeholder="#00ffff" oninput="document.getElementById('liveBox').style.backgroundColor = this.value">
</div>

<marquee class="space-marquee" scrollamount="4">
    <span id="spaceLenta">Загрузка космических метрик...</span>
</marquee>

<script>
// Переменная для хранения точного серверного времени
let baseTime = null;
// Переменная для фиксации момента запроса к серверу
let lastFetch = null;
// Новая переменная: сюда мы сохраним название часового пояса, полученное от API
let userTimezone = "локальном часовом поясе";

// Асинхронная функция запроса времени и данных о сети
async function fetchUTCTime() {
    try {
        const res = await fetch('https://worldtimeapi.org/api/ip');
        const data = await res.json();
        baseTime = new Date(data.datetime);
        lastFetch = Date.now();
        // Сохраняем имя часового пояса (например: "Europe/Kaliningrad") из ответа сервера
        userTimezone = data.timezone;
    } catch (err) {
        console.error("Ошибка при получении времени, используем системное:", err);
        baseTime = new Date();
        lastFetch = Date.now();
        // Если интернет упал, вычисляем часовой пояс встроенными силами браузера
        userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    }
}

// Главная циклическая функция перерасчета времени и планетных суток
function updateClocks() {
    if (!baseTime) return;

    const delta = Date.now() - lastFetch;
    const now = new Date(baseTime.getTime() + delta);

    // Меняем текст подписи над часами, подставляя туда реальный часовой пояс ХХХ
    document.getElementById("timezoneLabel").textContent = `Время в часовом поясе [ ${userTimezone} ]`;

    // ===== Обычное время =====
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById("normalClock").textContent = `${h}:${m}:${s}`;

    // ===== Расчет секунд для Космической Ленты =====
    const secondsSinceMidnight = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000;

    // 1. ДЕСЯТИЧНОЕ ВРЕМЯ (Земля 10-часовая)
    const decimalDayFraction = secondsSinceMidnight / 86400;
    const totalDecimalSeconds = decimalDayFraction * 100000;
    const decHour = String(Math.floor(totalDecimalSeconds / 10000)).padStart(2, '0');
    const decMinute = String(Math.floor((totalDecimalSeconds % 10000) / 100)).padStart(2, '0');
    const decSecond = String(Math.floor(totalDecimalSeconds % 100)).padStart(2, '0');
    const decimalString = `${decHour}:${decMinute}:${decSecond}`;

    // 2. МАРСИАНСКОЕ ВРЕМЯ (Сол длится 88775.244 секунд Земли вместо 86400)
    const marsFraction = secondsSinceMidnight / 88775.244;
    const marsTotalSeconds = marsFraction * 86400; // раскладываем Марс обратно на их 24 "марсианских" часа
    const marsH = String(Math.floor(marsTotalSeconds / 3600) % 24).padStart(2, '0');
    const marsM = String(Math.floor((marsTotalSeconds % 3600) / 60)).padStart(2, '0');
    const marsS = String(Math.floor(marsTotalSeconds % 60)).padStart(2, '0');

    // 3. ЛУННОЕ ВРЕМЯ (Сутки на Луне длятся 27.3 земных суток)
    // Показывает текущую фазу лунного дня в процентах для простоты понимания "на ходу"
    const moonProgress = ((decimalDayFraction / 27.3) * 100).toFixed(4);

    // 4. ВЕНЕРИАНСКОЕ ВРЕМЯ (Сутки длятся аж 243 земных дня!)
    const venusProgress = ((decimalDayFraction / 243) * 100).toFixed(5);

    // 5. СОЛНЕЧНОЕ ВРЕМЯ (Полный оборот экватора Солнца занимает около 25.05 земных суток)
    const sunProgress = ((decimalDayFraction / 25.05) * 100).toFixed(4);

    // Склеиваем все космические метрики в одну строку с большими отступами (&nbsp;)
    const spaceText = `🪐 ДЕСЯТИЧНОЕ ВРЕМЯ (Земля): ${decimalString} &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; 
                       🚀 МАРСИАНСКОЕ ВРЕМЯ (Сол): ${marsH}:${marsM}:${marsS} &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; 
                       🌙 ЛУННЫЙ ДЕНЬ (Прогресс суток): ${moonProgress}% &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; 
                       🌋 ВЕНЕРИАНСКИЕ СУТКИ: ${venusProgress}% &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; 
                       ☀️ ОБОРОТ СОЛНЦА ВОКРУГ ОСИ: ${sunProgress}%`;
    
    // Вставляем получившуюся ленту в бегущую строку
    document.getElementById("spaceLenta").innerHTML = spaceText;

    // ===== Умный таймер рабочего графика (Правый верхний угол) =====
    const currentDay = now.getDay();
    const startOfWorkToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 8, 0, 0, 0);
    let endOfWorkToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 17, 15, 0, 0);
    
    if (currentDay === 5) {
        endOfWorkToday.setHours(16, 0, 0, 0);
    }

    let labelText = "";
    let targetTime = null;
    const isWorkingDay = (currentDay >= 1 && currentDay <= 5);
    const timerElement = document.getElementById("countdownTimer");

    if (isWorkingDay && now >= startOfWorkToday && now < endOfWorkToday) {
        labelText = "До конца рабочего дня:";
        targetTime = endOfWorkToday;

        // Плавный перелив цвета внутри рабочего периода
        const totalWorkMs = endOfWorkToday - startOfWorkToday;
        const passedWorkMs = now - startOfWorkToday;
        const progress = passedWorkMs / totalWorkMs;

        const r = Math.floor(255 - (255 * progress));
        const g = Math.floor(85 + ((255 - 85) * progress));
        const b = Math.floor(85 + ((127 - 85) * progress));

        timerElement.style.color = `rgb(${r}, ${g}, ${b})`;
    } else {
        labelText = "До начала рабочего дня:";
        timerElement.style.color = "#ff5555"; // Вне работы таймер горит классическим красным
        
        let nextTarget = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 8, 0, 0, 0);
        
        if (isWorkingDay && now < startOfWorkToday) {
            nextTarget = startOfWorkToday;
        } else {
            while (nextTarget.getDay() === 0 || nextTarget.getDay() === 6) {
                nextTarget.setDate(nextTarget.getDate() + 1);
            }
        }
        targetTime = nextTarget;
    }

    const diffMs = targetTime - now;
    const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
    const diffMinutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
    const diffSeconds = Math.floor((diffMs % (1000 * 60)) / 1000);

    const th = String(diffHours).padStart(2, '0');
    const tm = String(diffMinutes).padStart(2, '0');
    const ts = String(diffSeconds).padStart(2, '0');

    document.getElementById("timerLabel").textContent = labelText;
    timerElement.textContent = `${th}:${tm}:${ts}`;
}

// Стартовая инициализация скриптов при запуске
fetchUTCTime().then(() => {
    updateClocks();
    setInterval(updateClocks, 50);
    setInterval(fetchUTCTime, 5 * 60 * 1000);
});
</script>
</body>
</html>
