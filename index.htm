<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>OrdoSkipit</title>
<style>
/* --- ОБЩЕСТРАНИЧНОЕ: Базовые стили для всего документа --- */
/* Устанавливаем темную тему, шрифт консоли и фиксируем размер окна */
body {
    background: #111;
    color: #eee;
    font-family: Consolas, monospace;
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
}

/* --- БЛОК ПОГОДЫ: Стилизация контейнера метеоданных --- */
/* Фиксируем блок в углу, чтобы он оставался видимым всегда */
.weather-static-panel {
    position: fixed;
    left: 20px;
    top: 20px;
    text-align: left;
    background: rgba(26, 26, 36, 0.7);
    padding: 15px;
    border-radius: 8px;
    border-left: 4px solid #00e5ff;
    font-size: 13px;
    line-height: 1.6;
    max-width: 300px;
    z-index: 1000;
}

/* Заголовок метеостанции для визуального выделения */
.weather-title {
    color: #00e5ff;
    font-weight: bold;
    margin-bottom: 5px;
    font-size: 14px;
}

/* --- ЧАСЫ И ТАЙМЕР: Блок контроля времени --- */
/* Размещаем в правом углу, отделяем от остального интерфейса */
.control-panel-corner {
    position: fixed;
    right: 30px;
    top: 20px;
    background: rgba(20, 20, 20, 0.8);
    padding: 12px 20px;
    border-radius: 8px;
    border: 1px solid #222;
    z-index: 999;
    text-align: right;
}

/* Сетка для выравнивания блока часов и таймера рядом */
.flex-time-row {
    display: flex;
    align-items: baseline;
    gap: 25px;
}

.time-block, .timer-block {
    text-align: right;
}

/* Подписи к цифрам для понимания, что именно отображается */
.timezone-sub, .timer-sub {
    font-size: 11px;
    color: #666;
    display: block;
    margin-bottom: 2px;
}

.timezone-sub {
    letter-spacing: 0.5px;
}

/* Настройка шрифта для цифровых значений */
.clock-digits, .timer-digits {
    font-size: 32px;
    font-weight: bold;
}

.clock-digits {
    color: #fff;
}

/* Анимация изменения цвета для таймера */
.timer-digits {
    transition: color 0.5s ease;
}

/* --- ОСНОВНОЕ ПОЛЕ: Центральная рабочая зона --- */
/* Контейнер для контента, центрирован относительно экрана */
.main-content-area {
    position: absolute;
    top: 150px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    text-align: center;
    color: #444;
    font-size: 16px;
    border: 1px dashed #222;
    padding: 60px;
    border-radius: 8px;
    letter-spacing: 2px;
}
    
/* --- БЛОК ТАБЛИЦЫ (OrdoSkipit Data) --- */
/* Контейнер для вывода данных. Добавлен для отображения контента из таблицы 
.main-content-area {
    position: absolute; top: 150px; left: 50%; transform: translateX(-50%);
    width: 60%; height: 50vh; overflow-y: auto;
    background: rgba(20, 20, 20, 0.9);
    border: 1px solid #333; padding: 20px; border-radius: 8px;
}*/
.table-row { border-bottom: 1px solid #333; padding: 8px 0; font-size: 14px; }

    
/* --- БЕГУЩАЯ СТРОКА: Нижняя информационная панель --- */
/* Фиксируем в самом низу страницы на всю ширину */
.space-marquee {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    background: #000;
    height: 40px;
    line-height: 40px;
    color: #00ffaa;
    font-size: 14px;
    border-top: 1px solid #333;
}

/* --- ТЕСТЕР ЦВЕТА: Вспомогательный UI-элемент --- */
.tester-container {
    position: fixed;
    right: 20px;
    bottom: 50px;
    text-align: left;
    background: rgba(30, 30, 30, 0.8);
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #444;
}

/* Визуальный индикатор цвета */
.live-box {
    display: inline-block;
    width: 30px;
    height: 30px;
    background-color: #888;
    border-radius: 4px;
    vertical-align: middle;
    margin-right: 10px;
}

/* Поле ввода для тестирования HEX-кодов */
.color-input {
    width: 120px;
    padding: 5px;
    background: #222;
    color: #fff;
    border: 1px solid #555;
    border-radius: 4px;
    font-family: inherit;
    vertical-align: middle;
}
</style>
</head>
<body>

<div class="weather-static-panel" id="weatherBlock">
    <div class="weather-title">📡 МЕТЕОСТАНЦИЯ</div>
    <div style="color: #aaa;">Связь со спутником...</div>
</div>

<div class="control-panel-corner">
    <div class="flex-time-row">
        <div class="time-block">
            <span id="timezoneLabel" class="timezone-sub">Время [ UTC ]</span>
            <div id="normalClock" class="clock-digits">--:--:--</div>
        </div>
        <div class="timer-block">
            <span id="timerLabel" class="timer-sub">Загрузка...</span>
            <div id="countdownTimer" class="timer-digits">--:--:--</div>
        </div>
    </div>
</div>

<div class="main-content-area">
    <div id="dbDataContainer" style="max-height: 70%; overflow-y: auto; margin-bottom: 15px;">
        OrdoSkipit: инициализация потока данных...
    </div>

    <div style="border-top: 1px dashed #333; padding-top: 15px; text-align: left;">
        <span style="color: #00e5ff; font-size: 12px; display: block; margin-bottom: 5px;">[ ВВОД НОВЫХ ДАННЫХ В ORDOSKIPIT ]</span>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="inputAuthor" placeholder="Автор (напр. Сержант)" style="background: #222; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; font-family: inherit; width: 30%;">
            <input type="text" id="inputText" placeholder="Введите текст сообщения..." style="background: #222; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; font-family: inherit; flex-grow: 1;">
            <button id="btnSubmit" style="background: #00e5ff; color: #111; border: none; padding: 8px 15px; border-radius: 4px; font-family: inherit; font-weight: bold; cursor: pointer; transition: background 0.2s;">ОТПРАВИТЬ</button>
        </div>
        <div id="sendStatus" style="font-size: 11px; margin-top: 5px; color: #666;"></div>
    </div>
</div>

<div class="tester-container">
    <div style="font-size: 12px; color: #888; margin-bottom: 5px;">Проба цвета на ходу:</div>
    <span id="liveBox" class="live-box"></span>
    <input type="text" id="colorInput" class="color-input" placeholder="#00ffff">
</div>

<marquee class="space-marquee" scrollamount="4" id="spaceMarquee">
    <span id="spaceLenta">Загрузка межпланетных календарей...</span>
</marquee>

<script>

// Твой рабочий URL из Google Apps Script
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby899DghhixLfbMIY_TblWR5y9_cNznKP37XZ_WdNpXDVLk_VQdkqoZjUT4vgTsw31sww/exec';

/* --- БЛОК ТАБЛИЦЫ: Загрузка --- */
// Запрашивает данные по ссылке SCRIPT_URL и отрисовывает их в OrdoSkipit-контейнер
async function loadTableData() {
    const container = document.getElementById('dbDataContainer');
    try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json(); 
        // Каждая строка таблицы превращается в div с классом table-row
        container.innerHTML = data.map(row => `
            <div class="table-row">
                <span style="color:#00e5ff;">[${row.author || 'SYSTEM'}]</span>: ${row.text || '...' }
            </div>
        `).join('');
    } catch (e) {
        container.innerHTML = `<div style="color:red;">Ошибка OrdoSkipit: ${e.message}</div>`;
    }
}
    
/* --- КОНСТАНТЫ И НАСТРОЙКИ: Математическая база расчетов --- */
const MS_IN_DAY = 86400000;
const LUNAR_CYCLE_MS = 2551443180;      // Продолжительность лунного месяца в мс
const SUN_ROTATION_MS = 2192832000;     // Длительность оборота Солнца в мс
const VENUS_YEAR_EARTH_DAYS = 224.7;    // Венера: земные дни в году
const VENUS_SOL_EARTH_DAYS = 116.75;    // Венера: земные дни в сутках
const MARS_YEAR_EARTH_DAYS = 686.98;    // Марс: земные дни в году
const MARS_SOL_EARTH_DAYS = 1.025957;   // Марс: длительность сола в земных сутках

/* --- СОСТОЯНИЕ: Переменные синхронизации --- */
let baseTime = null; // Точка отсчета времени
let lastFetch = null; // Время последнего получения ответа от сервера
let userTimezone = "UTC"; // Определенная часовая зона пользователя

/* --- КЭШ: Ссылки на DOM для оптимизации доступа --- */
const dom = {
    weather: document.getElementById("weatherBlock"),
    timezone: document.getElementById("timezoneLabel"),
    clock: document.getElementById("normalClock"),
    timerLabel: document.getElementById("timerLabel"),
    timer: document.getElementById("countdownTimer"),
    spaceLenta: document.getElementById("spaceLenta"),
    liveBox: document.getElementById("liveBox"),
    colorInput: document.getElementById("colorInput")
};

/* --- ОБЩЕСТРАНИЧНОЕ: Получение точного времени через API --- */
async function fetchUTCTime() {
    try {
        const res = await fetch('https://worldtimeapi.org/api/ip');
        const data = await res.json();
        baseTime = new Date(data.datetime);
        lastFetch = Date.now();
        userTimezone = data.timezone;
    } catch (err) {
        // Резервный режим: при ошибке сети используем системные часы
        console.error("Ошибка сети, переход на системное время:", err);
        baseTime = new Date();
        lastFetch = Date.now();
        userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    }
}

/* --- БЛОК ПОГОДЫ: Обновление метеоданных --- */
async function fetchRealWeather() {
    try {
        const res = await fetch('https://wttr.in/?format=j1');
        const data = await res.json();
        
        // Извлекаем актуальные данные из структуры wttr.in
        const current = data.current_condition[0];
        const city = data.nearest_area[0].areaName[0].value;
        const temp = current.temp_C;
        const desc = current.lang_ru ? current.lang_ru[0].value : current.weatherDesc[0].value;
        const humidity = current.humidity;
        const windMs = (parseFloat(current.windspeedKmph) / 3.6).toFixed(1);

        // Обновляем HTML-содержимое панели погоды
        dom.weather.innerHTML = `
            <div class="weather-title">📍 ПОГОДА (${city})</div>
            <div>• Температура: <b>${temp}°C</b></div>
            <div>• Состояние: <span>${desc}</span></div>
            <div>• Влажность: <span>${humidity}%</span></div>
            <div>• Ветер: <span>${windMs} м/с</span></div>
        `;
    } catch (err) {
        // Ошибка отображается в интерфейсе
        console.error("Не удалось получить погоду:", err);
        dom.weather.innerHTML = `
            <div class="weather-title">📍 МЕТЕОСТАНЦИЯ</div>
            <div style="color: #ff5555;">Автономный режим (ошибка сети)</div>
        `;
    }
}

/* --- ТАЙМЕР: Вспомогательная логика проверки выходных --- */
function isWeekend(day) {
    return day === 0 || day === 6;
}

/* --- ЧАСЫ И ТАЙМЕР: Главная логика тикания часов и расчетов --- */
function updateClocks() {
    if (!baseTime) return;

    // Вычисляем текущее время с учетом сдвига с момента последнего запроса
    const now = new Date(baseTime.getTime() + (Date.now() - lastFetch));

    dom.timezone.textContent = `Время [ ${userTimezone} ]`;

    // Форматирование часов, минут и секунд
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    dom.clock.textContent = `${h}:${m}:${s}`;

    /* --- ТАЙМЕР: Логика рабочего графика --- */
    const currentDay = now.getDay();
    const year = now.getFullYear();
    const month = now.getMonth();
    const date = now.getDate();

    const startOfWorkToday = new Date(year, month, date, 8, 0, 0, 0);
    const endOfWorkToday = new Date(year, month, date, currentDay === 5 ? 16 : 17, currentDay === 5 ? 0 : 15, 0, 0);

    let labelText = "";
    let targetTime = null;
    const isWorkingDay = !isWeekend(currentDay);
    let dynamicColor = "#ff5555"; 

    // Вычисление фазы рабочего дня для изменения цвета
    if (isWorkingDay && now >= startOfWorkToday && now < endOfWorkToday) {
        labelText = "До конца смены:";
        targetTime = endOfWorkToday;

        const progress = (now - startOfWorkToday) / (endOfWorkToday - startOfWorkToday);
        const r = Math.floor(255 - (255 * progress));
        const g = Math.floor(85 + (170 * progress));
        const b = Math.floor(85 + (42 * progress));
        dynamicColor = `rgb(${r}, ${g}, ${b})`;
    } else {
        // Определение следующей цели, если смена не идет
        labelText = "До начала смены:";
        let nextTarget = new Date(year, month, date + 1, 8, 0, 0, 0);
        if (isWorkingDay && now < startOfWorkToday) {
            nextTarget = startOfWorkToday;
        } else {
            while (isWeekend(nextTarget.getDay())) {
                nextTarget.setDate(nextTarget.getDate() + 1);
            }
        }
        targetTime = nextTarget;
    }

    if (dom.timer.style.color !== dynamicColor) {
        dom.timer.style.color = dynamicColor;
    }

    // Расчет разницы времени и обновление DOM
    const diffMs = targetTime - now;
    const diffHours = Math.floor(diffMs / 3600000);
    const diffMinutes = Math.floor((diffMs % 3600000) / 60000);
    const diffSeconds = Math.floor((diffMs % 60000) / 1000);

    dom.timerLabel.textContent = labelText;
    dom.timer.textContent = `${String(diffHours).padStart(2, '0')}:${String(diffMinutes).padStart(2, '0')}:${String(diffSeconds).padStart(2, '0')}`;

    /* --- КОСМИЧЕСКИЕ МЕТРИКИ: Астрономические вычисления --- */
    const currentMs = now.getTime();
    const totalEarthDays = (currentMs - Date.UTC(1, 0, 1, 0, 0, 0, 0)) / MS_IN_DAY;

    const venusYearsTotal = totalEarthDays / VENUS_YEAR_EARTH_DAYS;
    const venusDaysTotal = totalEarthDays / VENUS_SOL_EARTH_DAYS;
    const marsYearsTotal = totalEarthDays / MARS_YEAR_EARTH_DAYS;
    const marsSolsTotal = totalEarthDays / MARS_SOL_EARTH_DAYS;

    // Вычисление фазы луны относительно опорной даты
    const moonCycles = (currentMs - Date.UTC(2000, 0, 6, 18, 14, 0)) / LUNAR_CYCLE_MS;
    const moonAgeDays = (moonCycles % 1) * 29.53059;
    
    let moonPhaseText = "";
    let moonIllumination = 0;
    if (moonAgeDays < 14.765) {
        moonPhaseText = "Растущая";
        moonIllumination = ((moonAgeDays / 14.765) * 100).toFixed(1);
    } else {
        moonPhaseText = "Убывающая";
        moonIllumination = (((29.53059 - moonAgeDays) / 14.765) * 100).toFixed(1);
    }
    if (moonAgeDays < 0.5 || moonAgeDays > 29.0) { moonPhaseText = "Новолуние"; moonIllumination = "0"; }
    else if (Math.abs(moonAgeDays - 14.76) < 0.5) { moonPhaseText = "Полнолуние"; moonIllumination = "100"; }

    const sunRotationsTotal = (currentMs - Date.UTC(1853, 10, 9, 12, 0, 0)) / SUN_ROTATION_MS;

    // Вывод всех данных в бегущую строку (marquee)
    dom.spaceLenta.innerHTML = `🌙 ЛУНА: ${moonPhaseText} (${moonIllumination}%) &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; 
                        🌋 ВЕНЕРА: ${Math.floor(venusDaysTotal) + 1}-ие сутки ${Math.floor(venusYearsTotal) + 1}-го года (день завершен на ${((venusDaysTotal % 1) * 100).toFixed(2)}%) &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; 
                        🚀 МАРС: ${Math.floor(marsSolsTotal) + 1}-ый Сол ${Math.floor(marsYearsTotal) + 1}-го года (завершен на ${((marsSolsTotal % 1) * 100).toFixed(2)}%) &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; 
                        ☀️ СОЛНЦЕ: идет ${Math.floor(sunRotationsTotal) + 1}-ый оборот (цикл выполнен на ${((sunRotationsTotal % 1) * 100).toFixed(2)}%)`;
}

/* --- ОБЩЕСТРАНИЧНОЕ: Инициализация системы --- */
async function init() {
   
    // 1. Загрузка данных таблицы OrdoSkipit
    await loadTableData();
    // 2. Обновление таблицы раз в 60 секунд
    setInterval(loadTableData, 60000);
    
    // Параллельный запуск критически важных сетевых запросов при загрузке
    await Promise.all([
        fetchUTCTime(),
        fetchRealWeather()
    ]);
    
    // Привязка логики тестера цвета в обход инлайн-скриптов
    dom.colorInput.addEventListener("input", (e) => {
        dom.liveBox.style.backgroundColor = e.target.value;
    });

// --- БЛОК ОТПРАВКИ ДАННЫХ В ТАБЛИЦУ ---
    const btnSubmit = document.getElementById("btnSubmit");
    const inputAuthor = document.getElementById("inputAuthor");
    const inputText = document.getElementById("inputText");
    const sendStatus = document.getElementById("sendStatus");

    btnSubmit.addEventListener("click", async () => {
        // Проверяем, чтобы поля не были пустыми
        if (!inputAuthor.value.trim() || !inputText.value.trim()) {
            sendStatus.textContent = "Ошибка: Заполните оба поля!";
            sendStatus.style.color = "#ff5555";
            return;
        }

        // Блокируем кнопку на время отправки, чтобы избежать дублей
        btnSubmit.disabled = true;
        btnSubmit.style.background = "#555";
        sendStatus.textContent = "Отправка пакета данных...";
        sendStatus.style.color = "#aaa";

        try {
            // Формируем параметры для отправки формата URL-encoded (наиболее стабильный для GAS)
            const formData = new URLSearchParams();
            formData.append("author", inputAuthor.value.trim());
            formData.append("text", inputText.value.trim());

            // Делаем POST-запрос к Google Apps Script
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // Используем no-cors, так как Google делает редиректы, которые браузер считает небезопасными
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData.toString()
            });

            // Так как режим no-cors не возвращает ответ, мы предполагаем успех, если нет ошибки сети
            sendStatus.textContent = "Данные успешно переданы в OrdoSkipit!";
            sendStatus.style.color = "#00ffaa";

            // Очищаем поле текста, а автора оставляем для удобства
            inputText.value = "";

            // Сразу же принудительно обновляем таблицу, чтобы увидеть свою запись (через 1.5 секунды, чтобы Google успел обработать)
            setTimeout(loadTableData, 1500);

        } catch (error) {
            console.error("Ошибка отправки:", error);
            sendStatus.textContent = `Критический сбой: ${error.message}`;
            sendStatus.style.color = "#ff5555";
        } finally {
            // Возвращаем кнопку в рабочее состояние
            btnSubmit.disabled = false;
            btnSubmit.style.background = "#00e5ff";
        }
    });
    
    // Запуск таймеров обновления данных
    updateClocks();
    setInterval(updateClocks, 1000);        // Обновление цифр каждую секунду
    setInterval(fetchUTCTime, 300000);      // Синхронизация времени каждые 5 минут
    setInterval(fetchRealWeather, 1800000); // Обновление погоды каждые 30 минут
}

// Запуск всего процесса
init();
</script>
</body>
</html>
