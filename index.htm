<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Обычные и десятичные часы</title>
<style>
body {
    background: #111;
    color: #eee;
    font-family: Consolas, monospace;
    text-align: center;
    margin-top: 60px;
}
.clock {
    font-size: 48px;
    margin: 20px;
}
.label {
    font-size: 18px;
    color: #aaa;
}
</style>
</head>
<body>

<div class="label">Обычное время WINAPI (24 часаааааа)</div>
<div id="normalClock" class="clock"></div>

<div class="label">Десятичное время (10ч × 100 × 100)</div>
<div id="decimalClock" class="clock"></div>

<script>
let baseTime = null; // точное серверное время
let lastFetch = null; // момент последнего обновления

async function fetchUTCTime() {
    try {
        // Запрашиваем локальное время пользователя на основе его IP
        const res = await fetch('https://worldtimeapi.org');
        const data = await res.json();
        baseTime = new Date(data.datetime);
        lastFetch = Date.now();
    } catch (err) {
        console.error("Ошибка при получении времени:", err);
        baseTime = new Date(); // fallback на системное время устройства
        lastFetch = Date.now();
    }
}

// ===== Обновление часов =====
function updateClocks() {
    if (!baseTime) return; // ждём первый fetch

    // сколько прошло миллисекунд с момента fetch
    const delta = Date.now() - lastFetch;
    const now = new Date(baseTime.getTime() + delta);

    // ===== Обычное локальное время =====
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById("normalClock").textContent = `${h}:${m}:${s}`;

    // ===== Десятичное локальное время =====
    const secondsSinceMidnight =
        now.getHours() * 3600 +
        now.getMinutes() * 60 +
        now.getSeconds() +
        now.getMilliseconds() / 1000;

    const decimalDayFraction = secondsSinceMidnight / 86400;
    const totalDecimalSeconds = decimalDayFraction * 100000;

    const decHour = Math.floor(totalDecimalSeconds / 10000);
    const decMinute = Math.floor((totalDecimalSeconds % 10000) / 100);
    const decSecond = Math.floor(totalDecimalSeconds % 100);

    const dh = String(decHour).padStart(2, '0');
    const dm = String(decMinute).padStart(2, '0');
    const ds = String(decSecond).padStart(2, '0');

    document.getElementById("decimalClock").textContent =
        `${dh}:${dm}:${ds}`;
}

// ===== Инициализация =====
fetchUTCTime().then(() => {
    updateClocks();
    setInterval(updateClocks, 50);

    // обновлять точное время раз в 5 минут для синхронизации
    setInterval(fetchUTCTime, 5 * 60 * 1000);
});
</script>
</body>
</html>
