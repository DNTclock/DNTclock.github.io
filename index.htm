<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ОРДО-ТЕРМИНАЛ</title>
    <style>
        body { background: #111; color: #eee; font-family: monospace; }
        .content { margin: 50px; }
    </style>
</head>
<body>
    <div class="content" id="wishesContainer">Загрузка данных...</div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1OQpFfjHblcr4sm5g_ELGk1SwMp000IEnv8W04M-78DJFJEjVI3NXHUo70uOHfn522g/exec';

        async function loadData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                document.getElementById('wishesContainer').innerHTML = 
                    data.map(row => `<div>${row.date} - ${row.text}</div>`).join('');
            } catch (e) {
                document.getElementById('wishesContainer').innerHTML = "Ошибка: " + e.message;
            }
        }
        loadData();
    </script>
</body>
</html>
