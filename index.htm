<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Космический пулет времени</title>
<style>
/* Настройки фона страницы и шрифта */
body {
    background: #111;
    color: #eee;
    font-family: Consolas, monospace;
    text-align: center;
    margin-top: 100px;
}
/* Стиль для главных домашних часов */
.clock {
    font-size: 64px;
    margin: 20px;
}
/* Подписи под и над элементами */
.label {
    font-size: 18px;
    color: #aaa;
    margin-top: 25px;
}
/* Позиционирование таймера в верхнем правом углу */
.timer-corner {
    position: fixed;
    right: 30px;
    top: 20px;
    text-align: right;
    background: rgba(20, 20, 20, 0.8);
    padding: 10px;
    border-radius: 6px;
}
/* Цифры таймера */
.timer-digits {
    font-size: 36px;
    font-weight: bold;
}
/* Бегущая строка в самом низу экрана */
.space-marquee {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    background: #000;
    height: 40px;
    line-height: 40px;
    color: #00ffaa;
    font-size: 14px;
    border-top: 1px solid #333;
}
/* Интерактивный тестер цвета в углу */
.tester-container {
    position: fixed;
    right: 20px;
    bottom: 50px;
    text-align: left;
    background: rgba(30, 30, 30, 0.8);
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #444;
}
/* Пробный квадрат в тестере */
.live-box {
    display: inline-block;
    width: 30px;
    height: 30px;
    background-color: #888;
    border-radius: 4px;
    vertical-align: middle;
    margin-right: 10px;
}
/* Поле ввода цвета */
.color-input {
    width: 120px;
    padding: 5px;
    background: #222;
    color: #fff;
    border: 1px solid #555;
    border-radius: 4px;
    font-family: inherit;
    vertical-align: middle;
}
</style>
</head>
<body>

<div id="timezoneLabel" class="label">Определяем часовой пояс...</div>
<div id="normalClock" class="clock">--:--:--</div>

<div class="timer-corner">
    <div id="timerLabel" style="font-size: 12px; color: #aaa; margin-bottom: 2px;">Загрузка...</div>
    <div id="countdownTimer" class="timer-digits">--:--:--</div>
</div>

<div class="tester-container">
    <div style="font-size: 12px; color: #888; margin-bottom: 5px;">Проба цвета на ходу:</div>
    <span id="liveBox" class="live-box"></span>
    <input type="text" id="colorInput" class="color-input" placeholder="#00ffff" oninput="document.getElementById('liveBox').style.backgroundColor = this.value">
</div>

<marquee class="space-marquee" scrollamount="4">
    <span id="spaceLenta">Загрузка межпланетных календарей...</span>
</marquee>

<script>
let baseTime = null;
let lastFetch = null;
let userTimezone = "локальном часовом поясе";

async function fetchUTCTime() {
    try {
        const res = await fetch('https://worldtimeapi.org/api/ip');
        const data = await res.json();
        baseTime = new Date(data.datetime);
        lastFetch = Date.now();
        userTimezone = data.timezone;
    } catch (err) {
        console.error("Ошибка сети, переходим на системную дату:", err);
        baseTime = new Date();
        lastFetch = Date.now();
        userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    }
}

function updateClocks() {
    if (!baseTime) return;

    const delta = Date.now() - lastFetch;
    const now = new Date(baseTime.getTime() + delta);

    // Обновляем часовой пояс в подписи
    document.getElementById("timezoneLabel").textContent = `Время в часовом поясе [ ${userTimezone} ]`;

    // Вывод обычного земного времени
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById("normalClock").textContent = `${h}:${m}:${s}`;

    // ==========================================
    // МАТЕМАТИКА КОСМИЧЕСКИХ КАЛЕНДАРЕЙ
    // ==========================================
    
    // 1. Вычисляем точное количество земных суток, прошедших с 1 января 1 года н.э.
    // UTC-время в миллисекундах для текущего момента
    const currentMs = now.getTime();
    // UTC-время в миллисекундах для 1 января 1 года нашей эры
    const eraStartMs = Date.UTC(1, 0, 1, 0, 0, 0, 0);
    // Общая разница в земных сутках (с дробной частью текущего дня)
    const totalEarthDays = (currentMs - eraStartMs) / (1000 * 60 * 60 * 24);

    // 2. ВЕНЕРА (Год = 224.7 земных суток, Солнечные сутки = 116.75 земных суток)
    const venusYearsTotal = totalEarthDays / 224.7;
    const venusYearCurrent = Math.floor(venusYearsTotal) + 1;
    const venusDaysTotal = totalEarthDays / 116.75;
    const venusDayCurrent = Math.floor(venusDaysTotal) + 1;
    const venusDayProgress = ((venusDaysTotal % 1) * 100).toFixed(2);

    // 3. МАРС (Год = 686.98 земных суток, Сол/сутки = 1.025957 земных суток)
    const marsYearsTotal = totalEarthDays / 686.98;
    const marsYearCurrent = Math.floor(marsYearsTotal) + 1;
    const marsSolsTotal = totalEarthDays / 1.025957;
    const marsSolCurrent = Math.floor(marsSolsTotal) + 1;
    const marsSolProgress = ((marsSolsTotal % 1) * 100).toFixed(2);

    // 4. ЛУНА (Расчет фазы на основе синодического месяца ~29.53059 суток)
    // Известное базовое новолуние (например, 6 января 2000 года)
    const knownNewMoonMs = Date.UTC(2000, 0, 6, 18, 14, 0);
    const moonCycles = (currentMs - knownNewMoonMs) / (1000 * 60 * 60 * 24 * 29.53059);
    const moonAgeDays = (moonCycles % 1) * 29.53059; // Сколько дней прошло с последнего новолуния
    
    let moonPhaseText = "";
    // Процент освещенности диска Луны для вывода на экран
    let moonIllumination = 0;

    if (moonAgeDays < 14.765) {
        moonPhaseText = "Растущая";
        moonIllumination = ((moonAgeDays / 14.765) * 100).toFixed(1);
    } else {
        moonPhaseText = "Убывающая";
        moonIllumination = (((29.53059 - moonAgeDays) / 14.765) * 100).toFixed(1);
    }
    // Отлавливаем крайние красивые точки
    if (moonAgeDays < 0.5 || moonAgeDays > 29.0) { moonPhaseText = "Новолуние"; moonIllumination = "0"; }
    else if (Math.abs(moonAgeDays - 14.76) < 0.5) { moonPhaseText = "Полнолуние"; moonIllumination = "100"; }

    // 5. СОЛНЦЕ (Оборот Кэррингтона равен 25.38 земных суток. Начало отсчета — 9 ноября 1853 г.)
    const carringtonStartMs = Date.UTC(1853, 10, 9, 12, 0, 0);
    const sunRotationsTotal = (currentMs - carringtonStartMs) / (1000 * 60 * 60 * 24 * 25.38);
    const sunRotationCurrent = Math.floor(sunRotationsTotal) + 1;
    const sunRotationProgress = ((sunRotationsTotal % 1) * 100).toFixed(2);

    // Сборка общей информационной ленты
    const spaceText = `🌙 ЛУНА: ${moonPhaseText} (${moonIllumination}%) &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; 
                       🌋 ВЕНЕРА: ${venusDayCurrent}-ие сутки ${venusYearCurrent}-го года (день завершен на ${venusDayProgress}%) &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; 
                       🚀 МАРС: ${marsSolCurrent}-ый Сол ${marsYearCurrent}-го года (завершен на ${marsSolProgress}%) &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; 
                       ☀️ СОЛНЦЕ: идет ${sunRotationCurrent}-ый оборот вокруг оси (текущий цикл выполнен на ${sunRotationProgress}%)`;
    
    document.getElementById("spaceLenta").innerHTML = spaceText;

    // ===== Логика таймера рабочего дня (Осталась без изменений) =====
    const currentDay = now.getDay();
    const startOfWorkToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 8, 0, 0, 0);
    let endOfWorkToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 17, 15, 0, 0);
    
    if (currentDay === 5) {
        endOfWorkToday.setHours(16, 0, 0, 0);
    }

    let labelText = "";
    let targetTime = null;
    const isWorkingDay = (currentDay >= 1 && currentDay <= 5);
    const timerElement = document.getElementById("countdownTimer");

    if (isWorkingDay && now >= startOfWorkToday && now < endOfWorkToday) {
        labelText = "До конца рабочего дня:";
        targetTime = endOfWorkToday;

        const totalWorkMs = endOfWorkToday - startOfWorkToday;
        const passedWorkMs = now - startOfWorkToday;
        const progress = passedWorkMs / totalWorkMs;

        const r = Math.floor(255 - (255 * progress));
        const g = Math.floor(85 + ((255 - 85) * progress));
        const b = Math.floor(85 + ((127 - 85) * progress));

        timerElement.style.color = `rgb(${r}, ${g}, ${b})`;
    } else {
        labelText = "До начала рабочего дня:";
        timerElement.style.color = "#ff5555";
        
        let nextTarget = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 8, 0, 0, 0);
        
        if (isWorkingDay && now < startOfWorkToday) {
            nextTarget = startOfWorkToday;
        } else {
            while (nextTarget.getDay() === 0 || nextTarget.getDay() === 6) {
                nextTarget.setDate(nextTarget.getDate() + 1);
            }
        }
        targetTime = nextTarget;
    }

    const diffMs = targetTime - now;
    const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
    const diffMinutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
    const diffSeconds = Math.floor((diffMs % (1000 * 60)) / 1000);

    const th = String(diffHours).padStart(2, '0');
    const tm = String(diffMinutes).padStart(2, '0');
    const ts = String(diffSeconds).padStart(2, '0');

    document.getElementById("timerLabel").textContent = labelText;
    timerElement.textContent = `${th}:${tm}:${ts}`;
}

fetchUTCTime().then(() => {
    updateClocks();
    setInterval(updateClocks, 50);
    setInterval(fetchUTCTime, 5 * 60 * 1000);
});
</script>
</body>
</html>
