<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Космический пульт управления</title>
<style>
/* БАЗОВЫЕ НАСТРОЙКИ ЭКРАНА */
body {
    background: #111;
    color: #eee;
    font-family: Consolas, monospace;
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
}

/* СТАТИЧНЫЙ БЛОК ПОГОДЫ В ЛЕВОМ ВЕРХНЕМ УГЛУ */
.weather-static-panel {
    position: fixed;
    left: 20px;
    top: 20px;
    text-align: left;
    background: rgba(26, 26, 36, 0.7);
    padding: 15px;
    border-radius: 8px;
    border-left: 4px solid #00e5ff;
    font-size: 13px;
    line-height: 1.6;
    max-width: 300px;
    z-index: 1000;
}

.weather-title {
    color: #00e5ff;
    font-weight: bold;
    margin-bottom: 5px;
    font-size: 14px;
}

/* ЕДИНАЯ СТРОКА ВРЕМЕНИ И ТАЙМЕРА В ПРАВОМ ВЕРХНЕМ УГЛУ */
.control-panel-corner {
    position: fixed;
    right: 30px;
    top: 20px;
    background: rgba(20, 20, 20, 0.8);
    padding: 12px 20px;
    border-radius: 8px;
    border: 1px solid #222;
    z-index: 999;
    text-align: right;
}

.flex-time-row {
    display: flex;
    align-items: baseline;
    gap: 25px;
}

.time-block, .timer-block {
    text-align: right;
}

/* Объединили общие стили подписей */
.timezone-sub, .timer-sub {
    font-size: 11px;
    color: #666;
    display: block;
    margin-bottom: 2px;
}

.timezone-sub {
    letter-spacing: 0.5px;
}

/* Объединили общие стили цифр часов и таймера */
.clock-digits, .timer-digits {
    font-size: 32px;
    font-weight: bold;
}

.clock-digits {
    color: #fff;
}

.timer-digits {
    transition: color 0.5s ease;
}

/* ЦЕНТРАЛЬНАЯ ЗОНА ДЛЯ ОСНОВНОГО КОНТЕНТА (ЗАГЛУШКА) */
.main-content-area {
    position: absolute;
    top: 150px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    text-align: center;
    color: #444;
    font-size: 16px;
    border: 1px dashed #222;
    padding: 60px;
    border-radius: 8px;
    letter-spacing: 2px;
}

/* КОСМИЧЕСКАЯ БЕГУЩАЯ СТРОКА ВНИЗУ */
.space-marquee {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    background: #000;
    height: 40px;
    line-height: 40px;
    color: #00ffaa;
    font-size: 14px;
    border-top: 1px solid #333;
}

/* ТЕСТЕР ЦВЕТА */
.tester-container {
    position: fixed;
    right: 20px;
    bottom: 50px;
    text-align: left;
    background: rgba(30, 30, 30, 0.8);
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #444;
}

.live-box {
    display: inline-block;
    width: 30px;
    height: 30px;
    background-color: #888;
    border-radius: 4px;
    vertical-align: middle;
    margin-right: 10px;
}

.color-input {
    width: 120px;
    padding: 5px;
    background: #222;
    color: #fff;
    border: 1px solid #555;
    border-radius: 4px;
    font-family: inherit;
    vertical-align: middle;
}
</style>
</head>
<body>

<div class="weather-static-panel" id="weatherBlock">
    <div class="weather-title">📡 МЕТЕОСТАНЦИЯ</div>
    <div style="color: #aaa;">Связь со спутником...</div>
</div>

<div class="control-panel-corner">
    <div class="flex-time-row">
        <div class="time-block">
            <span id="timezoneLabel" class="timezone-sub">Время [ UTC ]</span>
            <div id="normalClock" class="clock-digits">--:--:--</div>
        </div>
        
        <div class="timer-block">
            <span id="timerLabel" class="timer-sub">Загрузка...</span>
            <div id="countdownTimer" class="timer-digits">--:--:--</div>
        </div>
    </div>
</div>

<div class="main-content-area">
    [ В РАЗРАБОТКЕ ]
</div>

<div class="tester-container">
    <div style="font-size: 12px; color: #888; margin-bottom: 5px;">Проба цвета на ходу:</div>
    <span id="liveBox" class="live-box"></span>
    <input type="text" id="colorInput" class="color-input" placeholder="#00ffff" oninput="dom.liveBox.style.backgroundColor = this.value">
</div>

<marquee class="space-marquee" scrollamount="4" id="spaceMarquee">
    <span id="spaceLenta">Загрузка межпланетных календарей...</span>
</marquee>

<script>
// Глобальное состояние
let baseTime = null;
let lastFetch = null;
let userTimezone = "UTC";

// Кэш DOM-элементов для защиты от утечек памяти и лишней нагрузки
const dom = {
    weather: document.getElementById("weatherBlock"),
    timezone: document.getElementById("timezoneLabel"),
    clock: document.getElementById("normalClock"),
    timerLabel: document.getElementById("timerLabel"),
    timer: document.getElementById("countdownTimer"),
    spaceLenta: document.getElementById("spaceLenta"),
    liveBox: document.getElementById("liveBox")
};

async function fetchUTCTime() {
    try {
        const res = await fetch('https://worldtimeapi.org/api/ip');
        const data = await res.json();
        baseTime = new Date(data.datetime);
        lastFetch = Date.now();
        userTimezone = data.timezone;
    } catch (err) {
        console.error("Ошибка сети, переход на системное время:", err);
        baseTime = new Date();
        lastFetch = Date.now();
        userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    }
}

async function fetchRealWeather() {
    try {
        const res = await fetch('https://wttr.in/?format=j1');
        const data = await res.json();
        
        const current = data.current_condition[0];
        const city = data.nearest_area[0].areaName[0].value;
        const temp = current.temp_C;
        const desc = current.lang_ru ? current.lang_ru[0].value : current.weatherDesc[0].value;
        const humidity = current.humidity;
        const windMs = (parseFloat(current.windspeedKmph) / 3.6).toFixed(1);

        dom.weather.innerHTML = `
            <div class="weather-title">📍 ПОГОДА (${city})</div>
            <div>• Температура: <b>${temp}°C</b></div>
            <div>• Состояние: <span>${desc}</span></div>
            <div>• Влажность: <span>${humidity}%</span></div>
            <div>• Ветер: <span>${windMs} м/с</span></div>
        `;
    } catch (err) {
        console.error("Не удалось получить погоду:", err);
        dom.weather.innerHTML = `
            <div class="weather-title">📍 МЕТЕОСТАНЦИЯ</div>
            <div style="color: #ff5555;">Автономный режим (ошибка сети)</div>
        `;
    }
}

function updateClocks() {
    if (!baseTime) return;

    // Вычисляем дельту один раз
    const now = new Date(baseTime.getTime() + (Date.now() - lastFetch));

    dom.timezone.textContent = `Время [ ${userTimezone} ]`;

    // Быстрое форматирование времени без создания лишних подстрок
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    dom.clock.textContent = `${h}:${m}:${s}`;

    // ===== Расчет таймера рабочего графика =====
    const currentDay = now.getDay();
    const year = now.getFullYear();
    const month = now.getMonth();
    const date = now.getDate();

    const startOfWorkToday = new Date(year, month, date, 8, 0, 0, 0);
    const endOfWorkToday = new Date(year, month, date, currentDay === 5 ? 16 : 17, currentDay === 5 ? 0 : 15, 0, 0);

    let labelText = "";
    let targetTime = null;
    const isWorkingDay = (currentDay >= 1 && currentDay <= 5);
    let dynamicColor = "#ff5555"; 

    if (isWorkingDay && now >= startOfWorkToday && now < endOfWorkToday) {
        labelText = "До конца смены:";
        targetTime = endOfWorkToday;

        const progress = (now - startOfWorkToday) / (endOfWorkToday - startOfWorkToday);

        // Плавный цветовой переход
        const r = Math.floor(255 - (255 * progress));
        const g = Math.floor(85 + (170 * progress));
        const b = Math.floor(85 + (42 * progress));
        dynamicColor = `rgb(${r}, ${g}, ${b})`;
    } else {
        labelText = "До начала смены:";
        
        let nextTarget = new Date(year, month, date + 1, 8, 0, 0, 0);
        if (isWorkingDay && now < startOfWorkToday) {
            nextTarget = startOfWorkToday;
        } else {
            while (nextTarget.getDay() === 0 || nextTarget.getDay() === 6) {
                nextTarget.setDate(nextTarget.getDate() + 1);
            }
        }
        targetTime = nextTarget;
    }

    if (dom.timer.style.color !== dynamicColor) {
        dom.timer.style.color = dynamicColor;
    }

    const diffMs = targetTime - now;
    const diffHours = Math.floor(diffMs / 3600000);
    const diffMinutes = Math.floor((diffMs % 3600000) / 60000);
    const diffSeconds = Math.floor((diffMs % 60000) / 1000);

    dom.timerLabel.textContent = labelText;
    dom.timer.textContent = `${String(diffHours).padStart(2, '0')}:${String(diffMinutes).padStart(2, '0')}:${String(diffSeconds).padStart(2, '0')}`;

    // ===== Космические метрики =====
    const currentMs = now.getTime();
    const totalEarthDays = (currentMs - Date.UTC(1, 0, 1, 0, 0, 0, 0)) / 86400000;

    const venusYearsTotal = totalEarthDays / 224.7;
    const venusDaysTotal = totalEarthDays / 116.75;
    const marsYearsTotal = totalEarthDays / 686.98;
    const marsSolsTotal = totalEarthDays / 1.025957;

    const moonCycles = (currentMs - Date.UTC(2000, 0, 6, 18, 14, 0)) / 2551443180;
    const moonAgeDays = (moonCycles % 1) * 29.53059;
    
    let moonPhaseText = "";
    let moonIllumination = 0;
    if (moonAgeDays < 14.765) {
        moonPhaseText = "Растущая";
        moonIllumination = ((moonAgeDays / 14.765) * 100).toFixed(1);
    } else {
        moonPhaseText = "Убывающая";
        moonIllumination = (((29.53059 - moonAgeDays) / 14.765) * 100).toFixed(1);
    }
    if (moonAgeDays < 0.5 || moonAgeDays > 29.0) { moonPhaseText = "Новолуние"; moonIllumination = "0"; }
    else if (Math.abs(moonAgeDays - 14.76) < 0.5) { moonPhaseText = "Полнолуние"; moonIllumination = "100"; }

    const sunRotationsTotal = (currentMs - Date.UTC(1853, 10, 9, 12, 0, 0)) / 2192832000;

    dom.spaceLenta.innerHTML = `🌙 ЛУНА: ${moonPhaseText} (${moonIllumination}%) &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; 
                       🌋 ВЕНЕРА: ${Math.floor(venusDaysTotal) + 1}-ие сутки ${Math.floor(venusYearsTotal) + 1}-го года (день завершен на ${((venusDaysTotal % 1) * 100).toFixed(2)}%) &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; 
                       🚀 МАРС: ${Math.floor(marsSolsTotal) + 1}-ый Сол ${Math.floor(marsYearsTotal) + 1}-го года (завершен на ${((marsSolsTotal % 1) * 100).toFixed(2)}%) &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; 
                       ☀️ СОЛНЦЕ: идет ${Math.floor(sunRotationsTotal) + 1}-ый оборот (цикл выполнен на ${((sunRotationsTotal % 1) * 100).toFixed(2)}%)`;
}

async function init() {
    await fetchUTCTime();
    await fetchRealWeather();
    
    updateClocks();
    setInterval(updateClocks, 50); 
    setInterval(fetchUTCTime, 300000); // 5 минут
    setInterval(fetchRealWeather, 1800000); // 30 минут
}

init();
</script>
</body>
</html>
